; *****************************************************************************
; Target environment for Zumo2040.
; *****************************************************************************

[env:Zumo2040]
; We use this platform to get the right toolchain for the Earle Philhower
; (arduino-pico) core, which provides direct access to the Pico SDK in addition to
; the Arduino framework.
; For more information, see https://github.com/maxgerhardt/platform-raspberrypi
; and https://arduino-pico.readthedocs.io/en/latest/.
; For a comparison between the standard Mbed OS core and the arduino-pico core,
; see https://github.com/earlephilhower/arduino-pico/discussions/246
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps = 
    symlink://../../../ZumoHALRP2040
    HAL
    Zumo2040
    ZumoHALInterfaces



